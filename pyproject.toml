[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soochak"
version = "1.0.0"
description = "Explainable Road Accident Severity Predictor + Intervention Simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.7.0",
    "aiosqlite==0.20.0",
    "onnxruntime==1.18.0",
    "shap==0.45.0",
    "xgboost==2.0.3",
    "optuna==3.6.0",
    "scikit-learn==1.5.0",
    "httpx==0.27.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "polars==0.20.0",
    "scipy==1.13.0",
    "python-dotenv==1.0.1",
    "joblib==1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "ruff==0.4.0",
    "bandit==1.7.8",
    "safety==3.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 75
