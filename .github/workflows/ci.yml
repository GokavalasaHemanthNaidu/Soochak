name: CI + Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/ --select E,F,W --ignore E501

      - name: Format check with ruff
        run: ruff format --check src/ tests/

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-fail-under=70

      - name: Security scan (Bandit)
        run: bandit -r src/ -ll -ii -f json -o bandit-report.json || true

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-r9hh-6236-j302 || true

      - name: Check .env not committed
        run: |
          if git ls-files | grep -q "^\\.env$"; then
            echo "ERROR: .env file committed to repository!"
            exit 1
          fi
          if git ls-files | grep -q "\\.pem$"; then
            echo "ERROR: PEM key committed!"
            exit 1
          fi
          echo "No secrets detected in repository"

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./coverage.xml
